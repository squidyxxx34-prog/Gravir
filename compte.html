<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon compte — Gravir</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg: #20221D;
  --panel: #2A2C25;
  --line: #3B3E33;
  --text: #EEEAE0;
  --muted: #A6A895;
  --accent: #C4622D;
}

* { box-sizing: border-box; }
html, body { overflow-x: hidden; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
}

h1, h2, h3, .font-display {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  font-weight: 700;
  margin: 0;
}

a { color: inherit; }

/* ---------- Header / nav ---------- */
.site-header {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
  z-index: 60;
}
.logo { font-size: 24px; display: flex; align-items: center; gap: 7px; white-space: nowrap; text-decoration: none; }
.logo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
.site-nav { display: flex; align-items: center; gap: 30px; }
.site-nav a {
  text-decoration: none;
  font-size: 14px;
  color: var(--muted);
  white-space: nowrap;
  padding: 4px 0;
  position: relative;
  transition: color .15s;
}
.site-nav a::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -3px;
  height: 2px; background: var(--accent);
  transform: scaleX(0); transform-origin: left;
  transition: transform .2s;
}
.site-nav a:hover, .site-nav a.active { color: var(--text); }
.site-nav a.active::after { transform: scaleX(1); }
.nav-cta {
  background: var(--accent);
  color: #fff !important;
  padding: 9px 18px;
  border-radius: 3px;
  font-weight: 600;
}
.nav-cta::after { display: none; }
.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  background: none; border: none; cursor: pointer; padding: 8px;
}
.nav-toggle span { width: 22px; height: 2px; background: var(--text); display: block; border-radius: 2px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  padding: 11px 20px;
  border-radius: 2px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); }
.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-accent:hover { background: #A6531F; }
.btn-block { width: 100%; justify-content: center; }

/* ---------- Forms ---------- */
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 11px 12px;
  border-radius: 2px;
  font-size: 15px;
  font-family: inherit;
}
.field input:focus {
  outline: none;
  border-color: var(--accent);
}
.form-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 32px;
  max-width: 420px;
  margin: 0 auto;
}
.form-error {
  background: #4A2A22;
  border: 1px solid #8A1F1F;
  color: #F2C4B6;
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 2px;
  margin-bottom: 16px;
}
.form-success {
  background: #29352A;
  border: 1px solid #3D6E4F;
  color: #CFE6D3;
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 2px;
  margin-bottom: 16px;
}

/* ---------- Footer ---------- */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 24px 28px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

.container { max-width: 1180px; margin: 0 auto; padding: 0 28px; }

</style>

    .site-header { padding: 14px 18px; }

    .nav-toggle { display: flex; }

      display: none;
      position: absolute; top: 100%; left: 0; right: 0;
      flex-direction: column; align-items: stretch; gap: 0;
      background: var(--bg); border-bottom: 1px solid var(--line);
      padding: 6px 18px 18px;
    }
    .site-nav.open { display: flex; }
    .site-nav a { padding: 13px 0; border-bottom: 1px solid var(--line); }
    .site-nav a::after { display: none; }
    .site-nav a.active { color: var(--accent); }
    .nav-cta { text-align: center; margin-top: 10px; }
    main { padding: 32px 18px; }
    .form-card { padding: 22px; }
    .dash-head { flex-direction: column; align-items: flex-start; gap: 12px; }
    .dash-head h2 { font-size: 24px; }
    .build-card { padding: 14px 16px; }
    .build-card .total { font-size: 18px; }
  }
</style>
</head>

  { id: "banshee-rune", brand: "Banshee", name: "Rune V3", category: "enduro", travel: 160, bb: "BSA73", shockEye: 230, shockStroke: 65, seatTube: 31.6, wheel: "29", axle: "12x148", brakeMount: "PM180", price: 1249, color: "#5A3E7A" },

const MERCHANTS = ["Alltricks", "Probikeshop", "Bike-Discount"];
function merchantLink(m, q) {
  return "https://www.google.com/search?q=" + encodeURIComponent(m + " " + q);
}

// ---------- LOGIQUE DE COMPATIBILITÉ ----------

function frameFrontWheel(frame) {
  return frame.wheel === "mullet" ? "29" : frame.wheel;
}
function compatibleForks(frame) {
  return FORKS.filter((f) => f.wheel === frameFrontWheel(frame));
}
function compatibleShocks(frame) {
  return SHOCKS.filter((s) => s.eye === frame.shockEye && s.stroke === frame.shockStroke);
}
function compatibleWheels(frame) {
  return WHEELS.filter((w) => w.wheel === frame.wheel && w.axle === frame.axle);
}
function compatibleBrakes(frame) {
  return BRAKES.filter((b) => b.mount === frame.brakeMount);
}
function compatibleSeatposts(frame) {
  // un diamètre inférieur passe avec une cale de réduction
  return SEATPOSTS.filter((p) => p.diameter <= frame.seatTube);
}

const CATEGORIES = [
  { key: "fork", label: "Fourche", getItems: compatibleForks, all: FORKS },
  { key: "shock", label: "Amortisseur", getItems: compatibleShocks, all: SHOCKS },
  { key: "wheels", label: "Roues", getItems: compatibleWheels, all: WHEELS },
  { key: "brakes", label: "Freins", getItems: compatibleBrakes, all: BRAKES },
  { key: "drivetrain", label: "Transmission", getItems: () => DRIVETRAINS, all: DRIVETRAINS },
  { key: "seatpost", label: "Tige de selle", getItems: compatibleSeatposts, all: SEATPOSTS },
  { key: "saddle", label: "Selle", getItems: () => SADDLES, all: SADDLES },
];

// Auth Supabase (projet "gravir-vtt")
const SUPABASE_URL = "https://awqfdmhevdqlepqmhhss.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pDKtP8gRUZinq8AAmCAPBA_TuCN2JWE";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function currentUser() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  return { id: user.id, email: user.email, name: user.user_metadata?.name || user.email.split("@")[0] };
}

async function loginUser(email, password) {
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return { ok: false, error: "E-mail ou mot de passe incorrect." };
  return { ok: true };
}

async function getBuilds(userId) {
  const { data, error } = await sb.from("builds").select("*").eq("user_id", userId).order("created_at", { ascending: false });
  if (error) { console.error(error); return []; }
  return data;
}

async function deleteBuildById(id) {
  await sb.from("builds").delete().eq("id", id);
}

</script>
<script>
async function renderDash() {
  const user = await currentUser();
  if (!user) {
    document.getElementById("loginView").style.display = "block";
    document.getElementById("dashView").style.display = "none";
    return;
  }
  document.getElementById("loginView").style.display = "none";
  document.getElementById("dashView").style.display = "block";
  document.getElementById("welcomeMsg").textContent = `Salut ${user.name}`;
  document.getElementById("userEmail").textContent = user.email;

  const builds = await getBuilds(user.id);
  const list = document.getElementById("buildsList");
  if (builds.length === 0) {
    list.innerHTML = `<p class="empty">Aucun build enregistré pour l'instant. <a href="configurateur.html" style="color:var(--accent);">Lancez le configurateur</a> pour en créer un.</p>`;
    return;
  }
  list.innerHTML = "";
  builds.forEach((build) => {
    const frame = FRAMES.find((f) => f.id === build.frame_id);
    const card = document.createElement("div");
    card.className = "build-card";
    card.innerHTML = `
      <div class="top">
        <div>
          <div class="date">${new Date(build.created_at).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })}</div>
          <strong>${frame ? frame.brand + " " + frame.name : "Cadre"}</strong>
        </div>
        <div class="total">${Number(build.total).toLocaleString("fr-FR")} €</div>
      </div>
      <ul>${build.items.map((i) => `<li>${i.label} — ${i.brand} ${i.name}</li>`).join("")}</ul>
      <button class="del">Supprimer</button>
    `;
    card.querySelector(".del").onclick = async () => {
      await deleteBuildById(build.id);
      renderDash();
    };
    list.appendChild(card);
  });
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const res = await loginUser(email, password);
  const errBox = document.getElementById("loginError");
  if (!res.ok) {
    errBox.innerHTML = `<div class="form-error">${res.error}</div>`;
    return;
  }
  errBox.innerHTML = "";
  renderDash();
});

document.getElementById("logoutBtn").onclick = async () => {
  await sb.auth.signOut();
  renderDash();
};

renderDash();
</script>
