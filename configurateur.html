<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurateur — Gravir</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg: #20221D;
  --panel: #2A2C25;
  --line: #3B3E33;
  --text: #EEEAE0;
  --muted: #A6A895;
  --accent: #C4622D;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
}

h1, h2, h3, .font-display {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  font-weight: 700;
  margin: 0;
}

a { color: inherit; }

/* ---------- Header / nav ---------- */
.site-header {
  border-bottom: 1px solid var(--line);
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.logo { font-size: 26px; }
.logo span { color: var(--accent); }
.site-nav { display: flex; gap: 22px; align-items: center; }
.site-nav a {
  text-decoration: none;
  font-size: 14px;
  color: var(--muted);
  transition: color .15s;
}
.site-nav a:hover, .site-nav a.active { color: var(--text); }
.nav-cta {
  background: var(--accent);
  color: #fff !important;
  padding: 8px 16px;
  border-radius: 2px;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  padding: 11px 20px;
  border-radius: 2px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); }
.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-accent:hover { background: #A6531F; }
.btn-block { width: 100%; justify-content: center; }

/* ---------- Forms ---------- */
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 11px 12px;
  border-radius: 2px;
  font-size: 15px;
  font-family: inherit;
}
.field input:focus {
  outline: none;
  border-color: var(--accent);
}
.form-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 32px;
  max-width: 420px;
  margin: 0 auto;
}
.form-error {
  background: #4A2A22;
  border: 1px solid #8A1F1F;
  color: #F2C4B6;
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 2px;
  margin-bottom: 16px;
}
.form-success {
  background: #29352A;
  border: 1px solid #3D6E4F;
  color: #CFE6D3;
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 2px;
  margin-bottom: 16px;
}

/* ---------- Footer ---------- */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 24px 28px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

.container { max-width: 1180px; margin: 0 auto; padding: 0 28px; }

</style>
<style>
  .layout { display: grid; grid-template-columns: 1fr 360px; }
  main { padding: 24px 28px; }
  .hero-frame {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    transition: background .3s;
  }
  .hero-frame .brand { font-size: 13px; color: var(--muted); text-transform: uppercase; }
  .hero-frame h2 { font-size: 36px; margin: 2px 0 12px; }
  .hero-specs { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
  .hero-swatch { width: 96px; height: 96px; border-radius: 3px; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed'; font-weight:700; font-size:42px; color:#fff; }

  .frame-picker { display: flex; gap: 8px; overflow-x: auto; margin-top: 14px; padding-bottom: 6px; }
  .frame-chip {
    flex-shrink: 0;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 2px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .frame-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .cat-section { margin-top: 34px; }
  .cat-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .cat-head h3 { font-size: 20px; }
  .cat-warn { font-size: 12px; color: var(--muted); }

  .part-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .part-card {
    text-align: left;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 2px;
    padding: 10px 12px;
    cursor: pointer;
    color: var(--text);
  }
  .part-card.active { border-color: var(--accent); background: #C4622D22; }
  .part-card .row { display: flex; align-items: center; justify-content: space-between; }
  .part-card .brand { font-size: 12px; color: var(--muted); }
  .part-card .name { font-size: 14px; font-weight: 500; margin: 3px 0; }
  .part-card .price { font-size: 12px; color: var(--muted); }
  .part-card .check { color: var(--accent); font-weight: 700; }

  aside.sidebar {
    border-left: 1px solid var(--line);
    padding: 24px 20px;
    align-self: start;
    position: sticky;
    top: 0;
  }
  .build-item { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .build-item .row { display: flex; justify-content: space-between; align-items:flex-start; }
  .build-item .label { font-size: 12px; color: var(--muted); }
  .build-item .name { font-size: 14px; font-weight: 500; }
  .build-item .price { font-family:'Barlow Condensed'; font-weight:700; }
  .merchants { display: flex; gap: 10px; margin-top: 6px; }
  .merchants a { font-size: 12px; color: var(--muted); text-decoration: underline dotted; }
  .merchants a:hover { color: var(--accent); }

  .total-row { display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .total-row .amount { font-size: 26px; color: var(--accent); font-family:'Barlow Condensed'; font-weight:700; }
  .missing { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 10px; }

  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    aside.sidebar { position: static; border-left: none; border-top: 1px solid var(--line); }
    .part-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .site-header { padding: 14px 18px; }
    .site-nav { gap: 12px; width: 100%; justify-content: space-between; }
    .logo { font-size: 22px; }
    main { padding: 18px; }
    aside.sidebar { padding: 18px; }
    .hero-frame { flex-direction: column-reverse; align-items: flex-start; padding: 18px; }
    .hero-frame h2 { font-size: 28px; }
    .hero-swatch { width: 56px; height: 56px; font-size: 24px; }
    .hero-specs { font-size: 12px; gap: 4px 12px; }
    .part-grid { grid-template-columns: 1fr; }
    .frame-chip { font-size: 13px; padding: 8px 12px; }
    .cat-head h3 { font-size: 18px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">GRAVIR <span>·</span></a>
  <nav class="site-nav">
    <a href="index.html">Accueil</a>
    <a href="configurateur.html" class="active">Configurateur</a>

  { id: "specialized-enduro", brand: "Specialized", name: "Enduro", travel: 170, bb: "PF92", shockEye: 230, shockStroke: 65, seatTube: 34.9, wheel: "29", axle: "12x148", brakeMount: "PM200", price: 3199, color: "#1E1E1E" },
  { id: "santacruz-megatower", brand: "Santa Cruz", name: "Megatower", travel: 160, bb: "PF92", shockEye: 230, shockStroke: 65, seatTube: 31.6, wheel: "29", axle: "12x148", brakeMount: "PM200", price: 3499, color: "#B08800" },

const FORKS = [

  { id: "rf-arc", brand: "Race Face", name: "Arc Offset 29", wheel: "29", axle: "12x148", price: 749 },

  { id: "code-rsc", brand: "SRAM", name: "Code RSC", mount: "PM200", price: 329 },

const SEATPOSTS = [

const MERCHANTS = ["Alltricks", "Probikeshop", "Bike-Discount"];
function merchantLink(m, q) {
  return "https://www.google.com/search?q=" + encodeURIComponent(m + " " + q);
}

// ---------- LOGIQUE DE COMPATIBILITÉ ----------

function frameFrontWheel(frame) {
  return frame.wheel === "mullet" ? "29" : frame.wheel;
}
function compatibleForks(frame) {
  return FORKS.filter((f) => f.wheel === frameFrontWheel(frame));
}
function compatibleShocks(frame) {
  return SHOCKS.filter((s) => s.eye === frame.shockEye && s.stroke === frame.shockStroke);
}
function compatibleWheels(frame) {
  return WHEELS.filter((w) => w.wheel === frame.wheel && w.axle === frame.axle);
}
function compatibleBrakes(frame) {
  return BRAKES.filter((b) => b.mount === frame.brakeMount);
}
function compatibleSeatposts(frame) {
  // un diamètre inférieur passe avec une cale de réduction
  return SEATPOSTS.filter((p) => p.diameter <= frame.seatTube);
}

const CATEGORIES = [
  { key: "fork", label: "Fourche", getItems: compatibleForks, all: FORKS },
  { key: "shock", label: "Amortisseur", getItems: compatibleShocks, all: SHOCKS },
  { key: "wheels", label: "Roues", getItems: compatibleWheels, all: WHEELS },
  { key: "brakes", label: "Freins", getItems: compatibleBrakes, all: BRAKES },
  { key: "drivetrain", label: "Transmission", getItems: () => DRIVETRAINS, all: DRIVETRAINS },
  { key: "seatpost", label: "Tige de selle", getItems: compatibleSeatposts, all: SEATPOSTS },
  { key: "saddle", label: "Selle", getItems: () => SADDLES, all: SADDLES },
];

// Auth Supabase (projet "gravir-vtt")
const SUPABASE_URL = "https://awqfdmhevdqlepqmhhss.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pDKtP8gRUZinq8AAmCAPBA_TuCN2JWE";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function currentUser() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  return { id: user.id, email: user.email, name: user.user_metadata?.name || user.email.split("@")[0] };
}

async function saveBuild(userId, build) {
  const { error } = await sb.from("builds").insert({
    user_id: userId, frame_id: build.frameId, items: build.items, total: build.total,
  });
  return { ok: !error, error: error?.message };
}

<script>
let frameId = FRAMES[0].id;
let selection = {}; // catKey -> item

function currentFrame() {
  return FRAMES.find((f) => f.id === frameId);
}

function renderHero() {
  const frame = currentFrame();
  const hero = document.getElementById("heroFrame");
  hero.style.background = `linear-gradient(120deg, ${frame.color}33, transparent)`;
  hero.innerHTML = `
    <div>
      <div class="brand">${frame.brand}</div>
      <h2>${frame.name}</h2>
      <div class="hero-specs">
        <span>Débattement ${frame.travel} mm</span>
        <span>Boîtier ${frame.bb}</span>
        <span>Amortisseur ${frame.shockEye}×${frame.shockStroke}</span>
        <span>Tube de selle Ø${frame.seatTube}</span>
        <span>Roue ${frame.wheel === "mullet" ? "Mullet (29/27.5)" : frame.wheel}</span>
        <span>Axe ${frame.axle}</span>
        <span>Frein ${frame.brakeMount}</span>
      </div>
    </div>
    <div class="hero-swatch" style="background:${frame.color}">${frame.brand.slice(0,1)}</div>
  `;
}

function renderFramePicker() {
  const el = document.getElementById("framePicker");
  el.innerHTML = "";
  FRAMES.forEach((f) => {
    const btn = document.createElement("button");
    btn.className = "frame-chip" + (f.id === frameId ? " active" : "");
    btn.textContent = `${f.brand} ${f.name}`;
    btn.onclick = () => {
      frameId = f.id;
      selection = {};
      renderAll();
    };
    el.appendChild(btn);
  });
}

function renderCategories() {
  const frame = currentFrame();
  const root = document.getElementById("categories");
  root.innerHTML = "";
  CATEGORIES.forEach((cat) => {
    const items = cat.getItems(frame);
    const excluded = cat.all.length - items.length;
    const section = document.createElement("section");
    section.className = "cat-section";
    section.innerHTML = `
      <div class="cat-head">
        <h3>${cat.label}</h3>
        ${excluded > 0 ? `<span class="cat-warn">⚠ ${excluded} incompatible${excluded > 1 ? "s" : ""} masqué${excluded > 1 ? "s" : ""}</span>` : ""}
      </div>
      <div class="part-grid"></div>
    `;
    const grid = section.querySelector(".part-grid");
    if (items.length === 0) {
      grid.innerHTML = `<p style="color:var(--muted);font-size:14px;font-style:italic;">Aucune pièce compatible en base pour ce cadre.</p>`;
    } else {
      items.forEach((item) => {
        const active = selection[cat.key]?.id === item.id;
        const card = document.createElement("button");
        card.className = "part-card" + (active ? " active" : "");
        card.innerHTML = `
          <div class="row"><span class="brand">${item.brand}</span>${active ? '<span class="check">✓</span>' : ""}</div>
          <div class="name">${item.name}</div>
          <div class="price">${item.price} €</div>
        `;
        card.onclick = () => {
          if (selection[cat.key]?.id === item.id) delete selection[cat.key];
          else selection[cat.key] = item;
          renderAll();
        };
        grid.appendChild(card);
      });
    }
    root.appendChild(section);
  });
}

function chosenItems() {
  const frame = currentFrame();
  const items = [{ label: "Cadre", brand: frame.brand, name: frame.name, price: frame.price }];
  CATEGORIES.forEach((c) => {
    if (selection[c.key]) items.push({ label: c.label, ...selection[c.key] });
  });
  return items;
}

function renderSidebar() {
  const items = chosenItems();
  const list = document.getElementById("buildList");
  list.innerHTML = "";
  items.forEach((item) => {
    const row = document.createElement("div");
    row.className = "build-item";
    row.innerHTML = `
      <div class="row">
        <div>
          <div class="label">${item.label} — ${item.brand}</div>
          <div class="name">${item.name}</div>
        </div>
        <div class="price">${item.price} €</div>
      </div>
      <div class="merchants">
        ${MERCHANTS.map((m) => `<a href="${merchantLink(m, item.brand + " " + item.name)}" target="_blank" rel="noreferrer">${m} ↗</a>`).join("")}
      </div>
    `;
    list.appendChild(row);
  });

  const missing = CATEGORIES.filter((c) => !selection[c.key]).map((c) => c.label);
  document.getElementById("missingList").textContent = missing.length ? `Pas encore choisi : ${missing.join(", ")}` : "";

  const total = items.reduce((sum, i) => sum + (i.price || 0), 0);
  document.getElementById("totalAmount").textContent = total.toLocaleString("fr-FR") + " €";
}

function renderAll() {
  renderHero();
  renderFramePicker();
  renderCategories();
  renderSidebar();
}

document.getElementById("resetBtn").onclick = () => { selection = {}; renderAll(); };

document.getElementById("saveBtn").onclick = async () => {
  const msg = document.getElementById("saveMsg");
  const user = await currentUser();
  if (!user) {
    msg.textContent = "Connectez-vous pour enregistrer ce build.";
    msg.style.color = "#C4622D";
    return;
  }
  msg.textContent = "Enregistrement…";
  msg.style.color = "var(--muted)";
  const items = chosenItems();
  const total = items.reduce((sum, i) => sum + (i.price || 0), 0);
  const res = await saveBuild(user.id, { frameId, items, total });
  if (!res.ok) {
    msg.textContent = "Erreur : " + res.error;
    msg.style.color = "#C4622D";
    return;
  }
  msg.textContent = "Build enregistré dans votre compte.";
  msg.style.color = "var(--muted)";
};

renderAll();
</script>
</body>
</html>
