<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Configurateur — Gravir</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg: #20221D;
  --panel: #2A2C25;
  --line: #3B3E33;
  --text: #EEEAE0;
  --muted: #A6A895;
  --accent: #C4622D;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
}

h1, h2, h3, .font-display {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  font-weight: 700;
  margin: 0;
}

a { color: inherit; }
button { font-family: inherit; }

/* ---------- Header / nav ---------- */
.site-header {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
  z-index: 60;
}
.logo { font-size: 24px; display: flex; align-items: center; gap: 7px; white-space: nowrap; text-decoration: none; }
.logo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
.site-nav { display: flex; align-items: center; gap: 30px; }
.site-nav a {
  text-decoration: none;
  font-size: 14px;
  color: var(--muted);
  white-space: nowrap;
  padding: 4px 0;
  position: relative;
  transition: color .15s;
}
.site-nav a::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -3px;
  height: 2px; background: var(--accent);
  transform: scaleX(0); transform-origin: left;
  transition: transform .2s;
}
.site-nav a:hover, .site-nav a.active { color: var(--text); }
.site-nav a.active::after { transform: scaleX(1); }
.nav-cta {
  background: var(--accent);
  color: #fff !important;
  padding: 9px 18px;
  border-radius: 3px;
  font-weight: 600;
}
.nav-cta::after { display: none; }
.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  background: none; border: none; cursor: pointer; padding: 8px;
}
.nav-toggle span { width: 22px; height: 2px; background: var(--text); display: block; border-radius: 2px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  padding: 11px 20px;
  border-radius: 2px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: border-color .15s, background .15s, opacity .15s;
}
.btn:hover { border-color: var(--accent); }
.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-accent:hover { background: #A6531F; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--line); }

/* ---------- Footer ---------- */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 24px 28px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
</style>

<style>
/* ================= PREMIUM WIZARD ================= */

/* ---- Écran de sélection Enduro / DH ---- */
.select-screen {
  min-height: calc(100dvh - 130px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  gap: 40px;
}
.select-intro { text-align: center; }
.select-intro .eyebrow {
  color: var(--accent);
  font-family: 'Barlow Condensed';
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-size: 13px;
  margin-bottom: 6px;
}
.select-intro h1 { font-size: 56px; }
.select-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  max-width: 980px;
  width: 100%;
}
.select-tile {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid var(--line);
  padding: 40px 32px;
  min-height: 340px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  text-align: left;
  cursor: pointer;
  color: var(--text);
  transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;
}
.select-tile:hover { transform: translateY(-6px); box-shadow: 0 24px 48px -12px rgba(0,0,0,.55); border-color: #555a48; }
.select-tile.enduro { background: radial-gradient(circle at 25% 15%, #3D6E4F 0%, #20221D 62%); }
.select-tile.dh { background: radial-gradient(circle at 75% 15%, #7A2E2E 0%, #17130f 62%); }
.select-tile .tile-tag {
  position: absolute; top: 26px; left: 32px;
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: #fff; background: rgba(255,255,255,.12); padding: 5px 10px; border-radius: 20px;
  backdrop-filter: blur(6px);
}
.select-tile h2 { font-size: 58px; margin-bottom: 10px; }
.select-tile p { color: rgba(255,255,255,.72); font-size: 15px; max-width: 34ch; line-height: 1.45; margin: 0; }
.select-tile .tile-arrow {
  position: absolute; top: 26px; right: 26px;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: #fff;
  transition: transform .25s, background .25s;
}
.select-tile:hover .tile-arrow { transform: translateX(3px); background: var(--accent); }

/* ---- Wizard header ---- */
.wizard-header {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.wizard-back {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 14px; display: flex; align-items: center; gap: 6px;
}
.wizard-back:hover { color: var(--text); }
.step-dots { display: flex; gap: 6px; }
.step-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: all .2s; }
.step-dot.done { background: var(--accent); }
.step-dot.active { background: var(--accent); width: 22px; border-radius: 4px; }
.step-count { font-size: 12px; color: var(--muted); font-family: 'Barlow Condensed'; letter-spacing: .05em; }

/* ---- Wizard body ---- */
.wizard-main { max-width: 1040px; margin: 0 auto; padding: 44px 24px 160px; }
.step-title { text-align: center; font-size: 40px; margin-bottom: 8px; }
.step-sub { text-align: center; color: var(--muted); font-size: 14px; max-width: 52ch; margin: 0 auto 36px; }

/* ---- Big product cards ---- */
.big-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.big-grid.frame-grid { grid-template-columns: repeat(2, 1fr); }
.big-card {
  position: relative;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  color: var(--text);
  transition: transform .2s, border-color .2s, box-shadow .2s;
}
.big-card:hover { transform: translateY(-4px); border-color: #565a4a; }
.big-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 16px 34px -14px rgba(196,98,45,.5); }
.art-box {
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #2E3126, #1B1D18);
}
.art-box.size-lg { height: 168px; }
.big-grid.frame-grid .art-box.size-lg { height: 200px; }
.art-glow { position: absolute; inset: -30%; border-radius: 50%; filter: blur(24px); opacity: .5; }
.art-box svg { width: 64%; height: 64%; position: relative; z-index: 1; }
.art-box.size-sm { width: 64px; height: 64px; border-radius: 6px; flex-shrink: 0; }
.art-box.size-sm svg { width: 60%; height: 60%; }
.big-card .check-badge {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
}
.big-card .info { padding: 16px 18px; }
.big-card .brand { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.big-card .name { font-size: 18px; font-weight: 600; margin: 3px 0 10px; }
.big-card .spec-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.big-card .spec-chips span {
  font-size: 11px; color: var(--muted); border: 1px solid var(--line);
  padding: 3px 8px; border-radius: 20px;
}
.big-card .price-row { display: flex; align-items: baseline; justify-content: space-between; }
.big-card .price-row .amount { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 20px; color: var(--accent); }
.big-card .price-row .merchant { font-size: 12px; color: var(--muted); }

.skip-hint { text-align: center; margin-top: 26px; color: var(--muted); font-size: 13px; }

/* ---- Summary step ---- */
.summary-list { display: flex; flex-direction: column; gap: 10px; max-width: 720px; margin: 0 auto; }
.summary-row {
  display: flex; align-items: center; gap: 16px;
  border: 1px solid var(--line); background: var(--panel);
  border-radius: 8px; padding: 12px 16px;
}
.summary-row .meta { flex: 1; min-width: 0; }
.summary-row .meta .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.summary-row .meta .name { font-size: 15px; font-weight: 600; }
.summary-row .meta a { font-size: 12px; color: var(--muted); text-decoration: underline dotted; }
.summary-row .meta a:hover { color: var(--accent); }
.summary-row .amount { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 19px; white-space: nowrap; }
.summary-msg { text-align: center; font-size: 13px; color: var(--muted); margin-top: 14px; }

/* ---- Pop-up de confirmation ---- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn .15s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 30px 26px; max-width: 340px; width: 100%; text-align: center;
  animation: popIn .18s ease-out;
}
@keyframes popIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-icon {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px; font-size: 24px; font-weight: 700;
}
.modal-icon.success { background: #2E4A2E; color: #8FD98F; }
.modal-icon.error { background: #4A2A22; color: #F2A98A; }
.modal-title { font-size: 21px; margin-bottom: 8px; }
.modal-text { font-size: 14px; color: var(--muted); margin-bottom: 22px; line-height: 1.5; }

/* ---- Sticky bottom price bar ---- */
.bottom-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px 28px calc(16px + env(safe-area-inset-bottom));
  background: var(--bg);
  border-top: 1px solid var(--line);
}
.bb-left { display: flex; align-items: baseline; gap: 10px; }
.bb-label { font-family: 'Barlow Condensed'; font-weight: 700; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.bb-amount { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 28px; color: var(--accent); }
.bb-right { display: flex; gap: 10px; }

/* ---- Responsive ---- */
@media (max-width: 900px) {
  .big-grid { grid-template-columns: repeat(2, 1fr); }
  .big-grid.frame-grid { grid-template-columns: 1fr; }
  .select-intro h1 { font-size: 44px; }
}
@media (max-width: 640px) {
  .site-header { padding: 14px 18px; }
  .logo { font-size: 21px; }
  .nav-toggle { display: flex; }
  .site-nav {
    display: none;
    position: absolute; top: 100%; left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 0;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 6px 18px 18px;
  }
  .site-nav.open { display: flex; }
  .site-nav a { padding: 13px 0; border-bottom: 1px solid var(--line); }
  .site-nav a::after { display: none; }
  .site-nav a.active { color: var(--accent); }
  .nav-cta { text-align: center; margin-top: 10px; }
  .select-screen { padding: 32px 16px; gap: 28px; min-height: calc(100dvh - 110px); }
  .select-intro h1 { font-size: 34px; }
  .select-grid { grid-template-columns: 1fr; }
  .select-tile { min-height: 260px; padding: 28px 22px; }
  .select-tile h2 { font-size: 42px; }
  .wizard-header { padding: 12px 16px; }
  .wizard-main { padding: 28px 16px 150px; }
  .step-title { font-size: 28px; }
  .big-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .big-card .art-box.size-lg { height: 110px; }
  .big-grid.frame-grid .art-box.size-lg { height: 140px; }
  .big-card .info { padding: 10px 12px; }
  .big-card .name { font-size: 14px; margin: 2px 0 6px; }
  .big-card .price-row .amount { font-size: 16px; }
  .bottom-bar { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  .bb-amount { font-size: 22px; }
  .summary-row { padding: 10px 12px; gap: 10px; }
  .summary-row .art-box.size-sm { width: 48px; height: 48px; }
}
@media (max-width: 380px) {
  .big-grid { grid-template-columns: 1fr; }
  .select-tile h2 { font-size: 34px; }
}
</style>
</head>

function merchantLink(m, q) {
  return "https://www.google.com/search?q=" + encodeURIComponent(m + " " + q);
}

// ---------- MEILLEUR PRIX (un seul marchand affiché par produit) ----------
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function bestPrice(item) {
  const offers = MERCHANTS.map((m) => {
    const variance = ((hashStr(item.id + m) % 9) - 4) / 100;
    return { merchant: m, price: Math.round(item.price * (1 + variance)) };
  }).sort((a, b) => a.price - b.price);
  const top = offers[0];
  return { merchant: top.merchant, price: top.price, url: merchantLink(top.merchant, item.brand + " " + item.name) };
}

// ---------- LOGIQUE DE COMPATIBILITÉ ----------
function frameFrontWheel(frame) {
  return frame.wheel === "mullet" ? "29" : frame.wheel;
}
function compatibleForks(frame) { return FORKS.filter((f) => f.wheel === frameFrontWheel(frame)); }
function compatibleShocks(frame) { return SHOCKS.filter((s) => s.eye === frame.shockEye && s.stroke === frame.shockStroke); }
function compatibleWheels(frame) { return WHEELS.filter((w) => w.wheel === frame.wheel && w.axle === frame.axle); }
function compatibleBrakes(frame) { return BRAKES.filter((b) => b.mount === frame.brakeMount); }
function compatibleSeatposts(frame) { return SEATPOSTS.filter((p) => p.diameter <= frame.seatTube); }

  frame: '<svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="42" cy="88" r="22"/><circle cx="158" cy="88" r="22"/><path d="M42 88L92 38H132L158 88M92 38L72 88M92 38L112 88M132 38L112 88"/><path d="M112 88H158"/></svg>',
  fork: '<svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="52" y="4" width="16" height="16" rx="3"/><rect x="132" y="4" width="16" height="16" rx="3"/><path d="M60 20V72M140 20V72"/><path d="M60 72Q100 98 140 72"/><path d="M100 98V116"/></svg>',
  shock: '<svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="100" cy="16" r="9"/><circle cx="100" cy="106" r="9"/><rect x="72" y="24" width="56" height="52" rx="10"/><path d="M100 76V90"/><path d="M86 90Q100 82 114 90"/><path d="M100 98V97"/></svg>',
  wheels: '<svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3"><circle cx="100" cy="60" r="50"/><circle cx="100" cy="60" r="33"/><circle cx="100" cy="60" r="5" fill="currentColor" stroke="none"/><g stroke-width="1.4"><path d="M100 60L100 27"/><path d="M100 60L129 42"/><path d="M100 60L129 78"/><path d="M100 60L100 93"/><path d="M100 60L71 78"/><path d="M100 60L71 42"/></g></svg>',
  brakes: '<svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3"><circle cx="90" cy="60" r="46"/><circle cx="90" cy="60" r="9" fill="currentColor" stroke="none"/><g fill="currentColor" stroke="none"><circle cx="90" cy="22" r="3"/><circle cx="128" cy="60" r="3"/><circle cx="90" cy="98" r="3"/><circle cx="52" cy="60" r="3"/></g><rect x="128" y="44" width="30" height="32" rx="6"/></svg>',
  drivetrain: '<svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3"><circle cx="70" cy="60" r="34"/><circle cx="70" cy="60" r="23"/><circle cx="70" cy="60" r="12"/><circle cx="70" cy="60" r="4" fill="currentColor" stroke="none"/><path d="M128 38L150 54V78L130 94" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  seatpost: '<svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M58 12H142" stroke-width="4"/><rect x="86" y="12" width="28" height="92" rx="11"/><path d="M68 106H132" stroke-width="2.4"/></svg>',
  saddle: '<svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M28 74c0-21 26-37 72-37s72 16 72 37-31 21-72 21-72 0-72-21z"/><path d="M44 88V102M156 88V102" stroke-width="2.2"/></svg>',
};

// Auth Supabase (projet "gravir-vtt")
const SUPABASE_URL = "https://awqfdmhevdqlepqmhhss.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pDKtP8gRUZinq8AAmCAPBA_TuCN2JWE";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function currentUser() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  return { id: user.id, email: user.email, name: user.user_metadata?.name || user.email.split("@")[0] };
}
async function saveBuild(userId, build) {
  const { error } = await sb.from("builds").insert({
    user_id: userId, frame_id: build.frameId, items: build.items, total: build.total,
  });
  return { ok: !error, error: error?.message };
}
</script>
<script>
// ---------- ÉTAT ----------
let catFilter = null;
let frameId = null;
let selection = {};
let stepIndex = 0;

function currentFrame() { return FRAMES.find((f) => f.id === frameId); }

function chosenItems() {
  const items = [];
  const frame = currentFrame();
  if (frame) items.push({ label: "Cadre", catKey: "frame", id: frame.id, brand: frame.brand, name: frame.name, price: frame.price });
  CATEGORIES.forEach((c) => {
    if (selection[c.key]) items.push({ label: c.label, catKey: c.key, ...selection[c.key] });
  });
  return items.map((i) => ({ ...i, best: bestPrice(i) }));
}
function totalPrice() {
  return chosenItems().reduce((sum, i) => sum + (i.best.price || 0), 0);
}

function artBlock(catKey, tint, size) {
  const sizeClass = size === "sm" ? "size-sm" : "size-lg";
  return `<div class="art-box ${sizeClass}"><div class="art-glow" style="background:${tint}"></div><div style="color:${tint};position:relative;z-index:1;display:flex;width:100%;height:100%;align-items:center;justify-content:center;">${CAT_ART[catKey] || ""}</div></div>`;
}

// ---------- ÉCRAN DE SÉLECTION ----------
document.querySelectorAll(".select-tile").forEach((tile) => {
  tile.addEventListener("click", () => {
    catFilter = tile.dataset.cat;
    frameId = null;
    selection = {};
    stepIndex = 0;
    document.getElementById("selectScreen").style.display = "none";
    document.getElementById("wizardScreen").style.display = "block";
    document.getElementById("bottomBar").style.display = "flex";
    renderWizard();
  });
});

document.getElementById("backToSelect").onclick = () => {
  document.getElementById("wizardScreen").style.display = "none";
  document.getElementById("bottomBar").style.display = "none";
  document.getElementById("selectScreen").style.display = "flex";
};

// ---------- WIZARD ----------
function renderWizard() {
  document.getElementById("backLabel").textContent = CATEGORY_LABELS[catFilter];
  const dotsEl = document.getElementById("stepDots");
  dotsEl.innerHTML = "";
  WIZARD_STEPS.forEach((s, i) => {
    const d = document.createElement("span");
    d.className = "step-dot" + (i === stepIndex ? " active" : i < stepIndex ? " done" : "");
    dotsEl.appendChild(d);
  });
  document.getElementById("stepCount").textContent = `${stepIndex + 1} / ${WIZARD_STEPS.length}`;
  renderStep();
  renderBottomBar();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function goStep(delta) {
  stepIndex = Math.max(0, Math.min(WIZARD_STEPS.length - 1, stepIndex + delta));
  renderWizard();
}

function renderStep() {
  const key = WIZARD_STEPS[stepIndex];
  const main = document.getElementById("wizardMain");
  const meta = STEP_META[key];

  if (key === "summary") {
    const items = chosenItems();
    main.innerHTML = `
      <h2 class="step-title">${meta.title}</h2>
      <p class="step-sub">${meta.sub}</p>
      <div class="summary-list" id="summaryList"></div>
    `;
    const list = document.getElementById("summaryList");
    items.forEach((item) => {
      const frame = item.catKey === "frame" ? currentFrame() : null;
      const tint = frame ? frame.color : "var(--accent)";
      const row = document.createElement("div");
      row.className = "summary-row";
      row.innerHTML = `
        ${artBlock(item.catKey, tint, "sm")}
        <div class="meta">
          <div class="label">${item.label} — ${item.brand}</div>
          <div class="name">${item.name}</div>
          <a href="${item.best.url}" target="_blank" rel="noreferrer">chez ${item.best.merchant} ↗</a>
        </div>
        <div class="amount">${item.best.price} €</div>
      `;
      list.appendChild(row);
    });
    return;
  }

  if (key === "frame") {
    const frames = FRAMES.filter((f) => f.category === catFilter);
    main.innerHTML = `
      <h2 class="step-title">${meta.title}</h2>
      <p class="step-sub">${meta.sub}</p>
      <div class="big-grid frame-grid" id="grid"></div>
    `;
    const grid = document.getElementById("grid");
    frames.forEach((f) => {
      const active = f.id === frameId;
      const best = bestPrice(f);
      const card = document.createElement("button");
      card.className = "big-card" + (active ? " active" : "");
      card.innerHTML = `
        ${active ? '<div class="check-badge">✓</div>' : ""}
        ${artBlock("frame", f.color)}
        <div class="info">
          <div class="brand">${f.brand} · ${f.travel}mm</div>
          <div class="name">${f.name}</div>
          <div class="spec-chips">
            <span>${f.bb}</span><span>Amorti ${f.shockEye}×${f.shockStroke}</span><span>${f.wheel === "mullet" ? "Mullet" : f.wheel}</span><span>${f.brakeMount}</span>
          </div>
          <div class="price-row"><span class="amount">${best.price} €</span><span class="merchant">chez ${best.merchant}</span></div>
        </div>
      `;
      card.onclick = () => { frameId = f.id; renderStep(); renderBottomBar(); };
      grid.appendChild(card);
    });
    return;
  }

  // catégorie de pièce
  const cat = CATEGORIES.find((c) => c.key === key);
  const frame = currentFrame();
  const items = cat.getItems(frame);
  const excluded = cat.all.length - items.length;
  main.innerHTML = `
    <h2 class="step-title">${meta.title}</h2>
    <p class="step-sub">${meta.sub}</p>
    <div class="big-grid" id="grid"></div>
    ${excluded > 0 ? `<p class="skip-hint">⚠ ${excluded} pièce${excluded > 1 ? "s" : ""} incompatible${excluded > 1 ? "s" : ""} masquée${excluded > 1 ? "s" : ""} pour ce cadre</p>` : ""}
    <p class="skip-hint">Optionnel — passe à l'étape suivante sans choisir si tu gardes déjà la pièce.</p>
  `;
  const grid = document.getElementById("grid");
  if (items.length === 0) {
    grid.innerHTML = `<p style="grid-column:1/-1;color:var(--muted);text-align:center;">Aucune pièce compatible en base pour ce cadre.</p>`;
  } else {
    items.forEach((item) => {
      const active = selection[key]?.id === item.id;
      const best = bestPrice(item);
      const card = document.createElement("button");
      card.className = "big-card" + (active ? " active" : "");
      card.innerHTML = `
        ${active ? '<div class="check-badge">✓</div>' : ""}
        ${artBlock(key, "var(--accent)")}
        <div class="info">
          <div class="brand">${item.brand}</div>
          <div class="name">${item.name}</div>
          <div class="price-row"><span class="amount">${best.price} €</span><span class="merchant">chez ${best.merchant}</span></div>
        </div>
      `;
      card.onclick = () => {
        if (selection[key]?.id === item.id) delete selection[key];
        else selection[key] = item;
        renderStep();
        renderBottomBar();
      };
      grid.appendChild(card);
    });
  }
}

function renderBottomBar() {
  document.getElementById("bbTotal").textContent = totalPrice().toLocaleString("fr-FR") + " €";
  const actions = document.getElementById("bottomActions");
  actions.innerHTML = "";
  const key = WIZARD_STEPS[stepIndex];

  if (stepIndex > 0) {
    const prev = document.createElement("button");
    prev.className = "btn";
    prev.textContent = "← Précédent";
    prev.onclick = () => goStep(-1);
    actions.appendChild(prev);
  }

  if (key === "summary") {
    const save = document.createElement("button");
    save.className = "btn btn-accent";
    save.id = "saveBtn";
    save.textContent = "Enregistrer ce build";
    save.onclick = onSaveBuild;
    actions.appendChild(save);
  } else {
    const next = document.createElement("button");
    next.className = "btn btn-accent";
    next.textContent = key === "frame" ? "Suivant →" : "Suivant →";
    if (key === "frame" && !frameId) next.disabled = true;
    next.onclick = () => goStep(1);
    actions.appendChild(next);
  }
}

function showModal(title, text, success) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-icon ${success ? "success" : "error"}">${success ? "✓" : "!"}</div>
      <h3 class="modal-title">${title}</h3>
      <p class="modal-text">${text}</p>
      <button class="btn btn-accent" style="width:100%;" id="modalCloseBtn">OK</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector("#modalCloseBtn").onclick = close;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
}

async function onSaveBuild() {
  const user = await currentUser();
  if (!user) {
    showModal("Connexion requise", "Connecte-toi pour enregistrer ce build.", false);
    return;
  }
  const items = chosenItems();
  const total = totalPrice();
  const res = await saveBuild(user.id, { frameId, items, total });
  if (!res.ok) {
    showModal("Échec de l'enregistrement", "Le build n'a pas pu être enregistré : " + res.error, false);
    return;
  }
  showModal("Build enregistré", "Ton build est bien enregistré dans ton compte, retrouvable dans « Mon compte ».", true);
}
</script>
</body>
</html>
